<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Health Companion</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* fitness-themed animated background accents */
        .fitness-decor {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .pulse-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(255,255,255,0.03));
            filter: blur(0.3px);
            animation: float 12s ease-in-out infinite;
        }

        .pulse-circle.small { width: 80px; height: 80px; }
        .pulse-circle.mid { width: 140px; height: 140px; }
        .pulse-circle.big { width: 220px; height: 220px; }

        .pulse-circle.c1 { top: 8%; left: 6%; animation-delay: 0s; }
        .pulse-circle.c2 { top: 70%; left: 10%; animation-delay: 2s; }
        .pulse-circle.c3 { top: 15%; right: 8%; animation-delay: 1s; }
        .pulse-circle.c4 { bottom: 10%; right: 12%; animation-delay: 3s; }
        .pulse-circle.c5 { bottom: 35%; left: 45%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.7; }
            50% { transform: translateY(-20px) translateX(10px) scale(1.05); opacity: 1; }
        }

        /* subtle diagonal fitness stripes */
        .fitness-decor::after {
            content: '';
            position: absolute;
            inset: -50% -50% -50% -50%;
            background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 8px, rgba(255,255,255,0.01) 8px 24px);
            transform: rotate(0.001deg); /* avoid subpixel blur issues */
        }

        /* heartbeat line at the bottom */
        .heartbeat-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 120px;
            z-index: 1;
            pointer-events: none;
            opacity: 1;
        }

        /* subtle dark-to-transparent gradient behind ECG for contrast */
        .heartbeat-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0));
            pointer-events: none;
        }

        .heartbeat {
            width: 100%;
            height: 100%;
        }

        .heartbeat path {
            stroke: rgba(255,255,255,0.98);
            stroke-width: 3.5;
            fill: none;
            stroke-dasharray: 10 8;
            animation: dash 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)) drop-shadow(0 0 20px rgba(118,75,162,0.45));
        }

        @keyframes dash {
            to { stroke-dashoffset: -200; }
        }

        /* faint watermark heart logo for brand feel */
        body::after {
            content: '';
            position: fixed;
            right: -40px;
            top: 10%;
            width: 320px;
            height: 320px;
            background: url('{% static "heart logo.png" %}') no-repeat center/contain;
            opacity: 0.06;
            z-index: 1;
            transform: rotate(-15deg);
            pointer-events: none;
            filter: blur(0.2px);
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            position: relative;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
            background: white;
        }

        .form-group input:hover {
            border-color: #bdc3c7;
            transform: translateY(-1px);
        }

        .submit-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e0e6ed;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .register-link a:hover {
            color: #764ba2;
        }

        .register-link a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(45deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .register-link a:hover::after {
            width: 100%;
        }

        

        .welcome-text {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #667eea;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .home-btn:hover {
            background: #667eea;
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .icon-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .icon {
            width: 170px;
            height: auto;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 30px;
            }

            h2 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

    <div class="fitness-decor" aria-hidden="true">
        <span class="pulse-circle small c1"></span>
        <span class="pulse-circle mid c2"></span>
        <span class="pulse-circle big c3"></span>
        <span class="pulse-circle small c4"></span>
        <span class="pulse-circle mid c5"></span>
    </div>

    <div class="heartbeat-wrap" aria-hidden="true">
        <svg class="heartbeat" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <!-- stylized ECG line -->
            <path d="M0,60 C60,60 80,60 120,60 C180,60 190,60 230,60 C250,60 260,45 270,60 C280,75 290,100 305,60 C315,35 330,10 345,60 C360,110 375,75 395,60 C430,35 450,60 500,60 C540,60 560,60 600,60 C640,60 650,60 680,60 C700,60 710,45 720,60 C730,75 740,100 755,60 C765,35 780,10 795,60 C810,110 825,75 845,60 C880,35 900,60 950,60 C990,60 1010,60 1050,60 C1090,60 1130,60 1200,60" />
        </svg>
    </div>

    <div class="container">
        <div class="icon-container">
            <img src="{% static 'smart-health-companion-logo.png' %}" alt="Smart Health Companion Logo" class="icon">
        </div>

        <h2>Welcome Back</h2>

        <div class="welcome-text">
            Sign in to access your personalized health advice
        </div>

        {% if success_message %}
            <div style="background: linear-gradient(45deg, #2ecc71, #27ae60); color: white; padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; font-weight: 500; box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);">
                {{ success_message }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>

        <div class="register-link">
            <p>Don't have an account? <a href="{% url 'register' %}">Create One</a></p>
            <p style="margin-top: 10px;"><a class="home-btn" href="{% url 'home' %}">Back to Home</a></p>
        </div>
    </div>

    
</body>
</html>
