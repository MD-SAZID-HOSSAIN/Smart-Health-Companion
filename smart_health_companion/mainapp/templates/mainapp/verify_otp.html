<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Smart Health Companion</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-grid-texture"></div>
        <div class="auth-pulse-wrap">
            <svg viewBox="0 0 1180 90" preserveAspectRatio="none">
                <path class="auth-pulse-path" d="M0,45 L420,45 L448,45 L462,14 L478,76 L494,45 L520,45 L536,30 L552,45 L1180,45" />
            </svg>
        </div>

        <div class="auth-card">
            <div class="auth-logo">
                <img src="{% static 'heart logo.png' %}" alt="Smart Health Companion">
            </div>

            <h2>Verify OTP &amp; Set New Password</h2>
            <p class="auth-subtext">Enter the code we sent you and choose a new password.</p>

            {% if success_message %}
                <div class="alert alert-success">{{ success_message }}</div>
            {% endif %}
            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="otp">OTP</label>
                    <input type="text" name="otp" id="otp" maxlength="6" required placeholder="Enter OTP">
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" name="new_password" id="new_password" required placeholder="Enter new password">
                </div>
                <button type="submit" class="submit-btn">Reset Password</button>
            </form>

            <div class="auth-links">
                <p><a href="{% url 'login' %}">← Back to Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
