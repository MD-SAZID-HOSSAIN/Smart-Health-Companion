<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Smart Health Companion</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating pulse circles */
        .fitness-decor {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .pulse-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), rgba(255,255,255,0.03));
            filter: blur(0.3px);
            animation: float 12s ease-in-out infinite;
        }

        .pulse-circle.small { width: 80px; height: 80px; }
        .pulse-circle.mid { width: 140px; height: 140px; }
        .pulse-circle.big { width: 220px; height: 220px; }

        .pulse-circle.c1 { top: 8%; left: 6%; animation-delay: 0s; }
        .pulse-circle.c2 { top: 70%; left: 10%; animation-delay: 2s; }
        .pulse-circle.c3 { top: 15%; right: 8%; animation-delay: 1s; }
        .pulse-circle.c4 { bottom: 10%; right: 12%; animation-delay: 3s; }
        .pulse-circle.c5 { bottom: 35%; left: 45%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.7; }
            50% { transform: translateY(-20px) translateX(10px) scale(1.05); opacity: 1; }
        }

        /* Heartbeat ECG line at bottom */
        .heartbeat-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 120px;
            z-index: 1;
            pointer-events: none;
        }

        .heartbeat-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.28), rgba(0,0,0,0));
        }

        .heartbeat {
            width: 100%;
            height: 100%;
        }

        .heartbeat path {
            stroke: rgba(255,255,255,0.98);
            stroke-width: 3.5;
            fill: none;
            stroke-dasharray: 10 8;
            animation: dash 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)) drop-shadow(0 0 20px rgba(118,75,162,0.45));
        }

        @keyframes dash {
            to { stroke-dashoffset: -200; }
        }

        /* Frosted glass container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2em;
            font-weight: 300;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            background: white;
            transform: translateY(-2px);
        }

        .form-group input:hover {
            border-color: #bdc3c7;
            transform: translateY(-1px);
        }

        .submit-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .error-message, .success-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .error-message {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            animation: shake 0.5s ease-in-out;
        }

        .success-message {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #667eea;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        @media (max-width: 768px) {
            .container { margin: 20px; padding: 30px; }
            h2 { font-size: 1.7em; }
        }
    </style>
</head>
<body>

    <div class="fitness-decor" aria-hidden="true">
        <span class="pulse-circle small c1"></span>
        <span class="pulse-circle mid c2"></span>
        <span class="pulse-circle big c3"></span>
        <span class="pulse-circle small c4"></span>
        <span class="pulse-circle mid c5"></span>
    </div>

    <div class="heartbeat-wrap" aria-hidden="true">
        <svg class="heartbeat" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,60 C60,60 80,60 120,60 C180,60 190,60 230,60 C250,60 260,45 270,60 C280,75 290,100 305,60 C315,35 330,10 345,60 C360,110 375,75 395,60 C430,35 450,60 500,60 C540,60 560,60 600,60 C640,60 650,60 680,60 C700,60 710,45 720,60 C730,75 740,100 755,60 C765,35 780,10 795,60 C810,110 825,75 845,60 C880,35 900,60 950,60 C990,60 1010,60 1050,60 C1090,60 1130,60 1200,60" />
        </svg>
    </div>

    <div class="container">
        <h2>Verify OTP & Set New Password</h2>

        {% if success_message %}
            <div class="success-message">{{ success_message }}</div>
        {% endif %}
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="otp">OTP</label>
                <input type="text" name="otp" id="otp" maxlength="6" required placeholder="Enter OTP">
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" required placeholder="Enter New Password">
            </div>
            <button type="submit" class="submit-btn">Reset Password</button>
        </form>

        <p style="text-align:center; margin-top:20px;">
            <a class="back-btn" href="{% url 'login' %}">Back to Login</a>
        </p>
    </div>
</body>
</html>
